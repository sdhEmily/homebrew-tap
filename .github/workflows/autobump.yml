name: Bump on schedule or request

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"

concurrency:
  group: tap-autobump
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  bump:
    runs-on: macos-26
    env:
      TAP: sdhEmily/tap
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
        with:
          core: true
          cask: true

      - name: Bump
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAILURES="$RUNNER_TEMP/autobump-failures.md"
          : > "$FAILURES"
          updated=0

          # Keep upstream output from being interpreted as workflow commands.
          log_token=$(uuidgen)
          printf '::stop-commands::%s\n' "$log_token"

          summarize() {
            local status=$?
            printf '::%s::\n' "$log_token"
            {
              echo '## Homebrew tap autobump'
              echo
              echo "- Bump commits prepared: $updated"
              echo "- Package failures: $(awk 'END { print NR }' "$FAILURES")"
              if [[ -s "$FAILURES" ]]; then
                echo
                cat "$FAILURES"
                echo
                echo 'See the **Bump** step logs for Homebrew diagnostics.'
              fi
              if (( status != 0 )); then
                echo
                echo 'The run stopped on a workflow error. Check the logs for the failing command and push status.'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap summarize EXIT

          brew tap "$TAP"
          cd "$(brew --repository "$TAP")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --quiet
          git checkout -B main FETCH_HEAD

          # List files without loading their Ruby definitions. A broken definition
          # can abort a tap-wide livecheck before it checks any other packages.
          packages=$(git ls-files -- 'Casks/*.rb' 'Formula/*.rb')

          livecheck() {
            local type="$1" package="$2" result attempt
            for attempt in 1 2 3; do
              if result=$(brew livecheck "--$type" --newer-only --json "$package") &&
                 jq -e 'type == "array" and all(.[]; .status != "error")' <<<"$result" >/dev/null; then
                jq -r '.[] | select(.version.outdated == true) | .version.latest' <<<"$result"
                return
              fi
              printf 'Livecheck attempt %s failed for %s.\n%s\n' "$attempt" "$package" "$result" >&2
              if (( attempt < 3 )); then
                sleep 15
              fi
            done
            return 1
          }

          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              Casks/*) type=cask ;;
              Formula/*) type=formula ;;
            esac
            name=${path##*/}
            name=${name%.rb}
            echo "Checking $type $name"

            if ! version=$(livecheck "$type" "$TAP/$name"); then
              printf -- "- \`%s\` (%s) — livecheck failed\n" "$name" "$type" >> "$FAILURES"
              continue
            fi
            [[ -n "$version" ]] || continue

            echo "Bumping $type $name -> $version"
            if brew "bump-${type}-pr" --write-only --no-browse --version="$version" "$TAP/$name"; then
              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "$name $version"
                updated=$((updated + 1))
              fi
            else
              printf -- "- \`%s\` (%s) — bump failed\n" "$name" "$type" >> "$FAILURES"
              # This is the runner's disposable tap checkout. Discard partial edits
              # so the next successful bump cannot commit the failed package.
              git reset --hard HEAD
              git clean -fd
            fi
          done <<<"$packages"

          if (( updated > 0 )); then
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:main
          fi

      - name: Track package failures
        if: ${{ !cancelled() && steps.bump.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_OUTCOME: ${{ steps.bump.outcome }}
        run: |
          set -euo pipefail
          FAILURES="$RUNNER_TEMP/autobump-failures.md"
          [[ -f "$FAILURES" ]] || exit 0

          title="Homebrew autobump package failures"
          repo_api="repos/$GITHUB_REPOSITORY"
          issue=$(gh api --paginate "$repo_api/issues?state=open&per_page=100" |
            jq -sc --arg title "$title" '[.[][] | select(
              .title == $title and .user.login == "github-actions[bot]" and .pull_request == null
            )] | first // empty')

          if [[ -s "$FAILURES" ]]; then
            body=$(printf 'Packages skipped by autobump\n\n%s\n\nSee the [workflow runs](%s/%s/actions/workflows/autobump.yml) for diagnostics.\n' \
              "$(cat "$FAILURES")" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY")
            if [[ -z "$issue" ]]; then
              url=$(gh api "$repo_api/issues" -f title="$title" -f body="$body" \
                -f "assignees[]=$GITHUB_REPOSITORY_OWNER" --jq .html_url)
            else
              number=$(jq -r '.number' <<<"$issue")
              url=$(jq -r '.html_url' <<<"$issue")
              if [[ "$(jq -r '.body' <<<"$issue")" != "$body" ]]; then
                gh api "$repo_api/issues/$number" --method PATCH -f body="$body" >/dev/null
              fi
            fi
            printf '\n[Autobump tracking issue](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$BUMP_OUTCOME" == success && -n "$issue" ]]; then
            number=$(jq -r '.number' <<<"$issue")
            gh api "$repo_api/issues/$number" --method PATCH -f state=closed -f state_reason=completed >/dev/null
          fi
